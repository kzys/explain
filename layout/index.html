<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      body {
        font-family: sans-serif;
	      margin: 0;
	      padding: 1rem 2rem;
        line-height: 1;
      }

      p, ul {
        line-height: 1.8;
      }

      div.files {
        border: 1px solid #000;
        padding: 1rem;
        margin-left: 20rem;
      }
      div.files ul, div.files li {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      div.files ul {
        margin-left: 1rem;
      }

      ul.toc {
        font-size: 90%;
        width: 15rem;
        background: #f0f0f0;
        border: 1px solid #000;
        margin: 0 1rem;
        float: left;
      }

      div.files {
        font-size: 90%;
      }

      main {
        margin-left: 20rem;
      }
    </style>
    <title>{{ title }}</title>
  </head>
  <body>
    <div class="column">
      {{ toc }}
      <main>
        {{ main }}
      </main>
    </div>
    <div class="files">{{ files }}</div>
  </body>
</html>
